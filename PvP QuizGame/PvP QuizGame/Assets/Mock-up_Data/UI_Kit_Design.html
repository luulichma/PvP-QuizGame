<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Quiz Game UI Kit - Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #4a148c; /* Purple */
            --accent-blue: #00e5ff;
            --accent-yellow: #ffea00;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #212121;
            --text-light: #ffffff;
            --shadow: 0 8px 16px rgba(0,0,0,0.2);
            --radius: 24px;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #6a1b9a, #4a148c);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-light);
        }

        .phone-frame {
            width: 375px; /* Standard Mobile Width */
            background: #121212;
            padding: 10px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            border: 8px solid #333;
        }

        .screen {
            width: 100%;
            height: 812px; /* iPhone X height approx */
            background: linear-gradient(180deg, #7b1fa2 0%, #4a148c 100%);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* --- UI COMPONENTS --- */

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: var(--accent-blue);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stats {
            display: flex;
            flex-direction: column;
        }

        .level-tag {
            background: var(--accent-yellow);
            color: #4a148c;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
            width: fit-content;
        }

        .money-count {
            font-weight: 600;
            font-size: 18px;
            color: var(--accent-yellow);
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px 20px;
            color: var(--text-dark);
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            position: relative;
        }

        .question-number {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-blue);
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: 600;
            box-shadow: var(--shadow);
        }

        .question-text {
            font-size: 20px;
            line-height: 1.4;
            font-weight: 600;
        }

        /* Answers */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .answer-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 18px;
            padding: 20px 10px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .answer-btn:active {
            transform: scale(0.95);
            background: var(--accent-blue);
            border-color: white;
        }

        .answer-btn.correct {
            background: var(--accent-green);
            border-color: white;
            box-shadow: 0 0 20px var(--accent-green);
        }

        .answer-btn.wrong {
            background: var(--accent-red);
            border-color: white;
        }

        /* Timer bar */
        .timer-container {
            margin-top: auto;
            margin-bottom: 40px;
            width: 100%;
        }

        .timer-bar-bg {
            background: rgba(0,0,0,0.3);
            height: 12px;
            border-radius: 10px;
            width: 100%;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .timer-bar-fill {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            height: 100%;
            width: 70%; /* Mock 70% left */
            border-radius: 10px;
            transition: width 0.3s;
        }

        /* Sprite Export Section (Horizontal) */
        .sprite-sheet {
            margin-top: 50px;
            background: #eee;
            padding: 30px;
            border-radius: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 90%;
            color: #333;
        }

        .sprite-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .sprite-box {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Individual Sprites for Export */
        .s-button-blue {
            background: linear-gradient(180deg, #00e5ff 0%, #00b8d4 100%);
            border: 4px solid #fff;
            border-radius: 20px;
            padding: 15px 40px;
            color: white;
            font-weight: 700;
            box-shadow: 0 6px 0 #00838f;
        }

        .s-panel-white {
            background: white;
            border-radius: 24px;
            border: 4px solid #ddd;
            width: 150px;
            height: 100px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .s-answer-slot {
            background: rgba(255,255,255,0.1);
            border: 3px solid rgba(255,255,255,0.4);
            border-radius: 18px;
            width: 120px;
            height: 60px;
        }

    </style>
</head>
<body>

    <h1 style="color: white; margin-bottom: 20px;">UI Kit Preview (Mobile Portrait)</h1>

    <div class="phone-frame">
        <div class="screen">
            <!-- HUD -->
            <div class="header">
                <div class="player-info">
                    <div class="avatar">👤</div>
                    <div class="stats">
                        <span class="money-count">$1,250</span>
                        <span class="level-tag">LEVEL 5</span>
                    </div>
                </div>
                <div class="player-info" style="flex-direction: row-reverse;">
                    <div class="avatar" style="background: var(--accent-red);">🤖</div>
                    <div class="stats" style="align-items: flex-end;">
                        <span class="money-count" style="color: white;">BOT</span>
                        <span class="level-tag" style="background: #ccc;">RANK B</span>
                    </div>
                </div>
            </div>

            <!-- Question Area -->
            <div class="question-card">
                <div class="question-number">CÂU 3 / 10</div>
                <p class="question-text">Thủ đô của Việt Nam là thành phố nào?</p>
            </div>

            <!-- Answers -->
            <div class="answers-grid">
                <div class="answer-btn">TP. Hồ Chí Minh</div>
                <div class="answer-btn correct">Hà Nội</div>
                <div class="answer-btn">Đà Nẵng</div>
                <div class="answer-btn">Cần Thơ</div>
            </div>

            <!-- Bottom UI -->
            <div class="timer-container">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600;">
                    <span>THỜI GIAN</span>
                    <span>12s</span>
                </div>
                <div class="timer-bar-bg">
                    <div class="timer-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <h2 style="color: white; margin-top: 60px;">Individual Assets for Sprites</h2>
    <div class="sprite-sheet">
        <div class="sprite-item">
            <div id="btn-main" class="s-button-blue">CLICK ME</div>
            <span>Main Button</span>
        </div>
        <div class="sprite-item">
            <div id="panel-white" class="s-panel-white"></div>
            <span>Panel (9-Slice)</span>
        </div>
        <div class="sprite-item" style="background: #4a148c; padding: 15px; border-radius: 10px;">
            <div id="answer-slot" class="s-answer-slot"></div>
            <span>Answer Button</span>
        </div>
        <div class="sprite-item">
            <div id="progress-bar" style="width: 200px; height: 15px; background: #333; border-radius: 10px; overflow: hidden; border: 2px solid #fff;">
                <div style="width: 60%; height: 100%; background: #00e676;"></div>
            </div>
            <span>Progress Bar</span>
        </div>
    </div>

</body>
</html>
